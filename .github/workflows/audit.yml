name: Project audit

on:
  push:
    branches:
      - "тест"
  pull_request:
    branches:
      - "тест"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static audit
        run: npm run check
